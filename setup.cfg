[metadata]
name = refactor-forge
version = 0.1.0
description = Safe, repeatable code transformations for repositories and LLM coding agents
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    refactor-forge = refactor_forge.cli:main
